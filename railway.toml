# Railway native deployment config (Railpack).
#
# Key points:
#   - buildCommand runs npm directly (not `make`) because Railpack images
#     may not include make by default.
#   - startCommand passes $PORT explicitly to `next start` — Next.js does
#     NOT read the PORT env var on its own, and shell expansion in npm
#     scripts is unreliable across environments.
#   - healthcheckTimeout is generous (120s) because Next.js cold-starts
#     on Railway's shared infra can take 30–60s.

[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "npx next start --hostname 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
